<div id="outcomes">
  <form hx-post="/opportunity/{{ item.id }}/outcome" hx-target="#outcomes" hx-swap="outerHTML" class="flex gap-2 items-end">
    <select name="stage" class="select select-xs select-bordered">{% for s in stages %}<option value="{{ s }}">{{ s }}</option>{% endfor %}</select>
    <input name="note" class="input input-xs input-bordered flex-grow" placeholder="note">
    <button class="btn btn-xs btn-primary">Record</button>
  </form>
  <ul class="text-xs mt-2">{% for o in item.outcomes %}<li><span class="badge badge-sm badge-outline">{{ o.stage }}</span> {{ o.created_at | fmt_dt }} {{ o.note }}</li>{% endfor %}</ul>
</div>
