<!DOCTYPE html>
<html lang="en" data-theme="pastel">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Opportunity Radar{% endblock %}</title>
  <link rel="stylesheet" href="/static/mdi/css/materialdesignicons.min.css">
  <link rel="stylesheet" href="/static/daisyui.full.min.css">
  <script src="/static/tailwind.js"></script>
  <script src="/static/htmx.min.js"></script>
  <script src="/static/alpine.min.js" defer></script>
  <style>
    [x-cloak] { display: none !important; }
    .htmx-indicator { opacity: 0; transition: opacity 150ms ease-in; }
    .htmx-request .htmx-indicator, .htmx-request.htmx-indicator { opacity: 1; }
    td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
    .badge { white-space: nowrap; }
  </style>
</head>
<body class="min-h-screen bg-base-200" x-data="{ collapsed: false }">
<div class="flex min-h-screen">
  <nav class="flex flex-col flex-shrink-0 bg-base-100 border-r border-base-300 transition-all duration-200" :class="collapsed ? 'w-14' : 'w-56'">
    <div class="flex items-center justify-between gap-2 px-3 py-2">
      <a href="/" class="flex items-center gap-2 overflow-hidden">
        <i class="mdi mdi-radar text-primary text-lg"></i>
        <span x-show="!collapsed" class="font-bold text-sm whitespace-nowrap">Opportunity Radar</span>
      </a>
      <button type="button" class="btn btn-ghost btn-xs px-1" @click="collapsed = !collapsed" aria-label="Toggle sidebar">
        <i class="mdi mdi-chevron-left" :style="collapsed ? 'transform: rotate(180deg)' : ''"></i>
      </button>
    </div>
    <div class="divider my-0"></div>
    <ul class="menu menu-sm flex-nowrap flex-grow overflow-y-auto overflow-x-hidden py-2" :class="collapsed ? 'px-0' : 'px-2'">
      {% for item in nav_items(request) %}
      {% if loop.changed(item.group) %}<li class="menu-title pt-3" x-show="!collapsed"><span>{{ item.group }}</span></li>{% endif %}
      <li><a href="{{ item.path }}" title="{{ item.label }}" class="{% if item.active %}active{% endif %}" :class="collapsed ? 'justify-center px-0' : ''">
        <i class="mdi {{ item.icon }}"></i><span x-show="!collapsed" class="whitespace-nowrap">{{ item.label }}</span></a></li>
      {% endfor %}
    </ul>
  </nav>
  <div class="flex flex-col flex-grow min-w-0">
    <header class="flex items-center gap-3 px-4 py-2 bg-base-100 border-b border-base-300">
      <h1 class="text-base font-semibold truncate">{% block heading %}{% endblock %}</h1>
      <div class="ml-auto flex items-center gap-2">{% block header_actions %}{% endblock %}</div>
    </header>
    <main class="flex-grow p-4 min-w-0">{% block content %}{% endblock %}</main>
  </div>
</div>
</body>
</html>
